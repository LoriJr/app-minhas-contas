services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fatura
      POSTGRES_USER: fatura
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fatura"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fatura
      DATABASE_USER: fatura
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      MAIL_FROM: ${MAIL_FROM:-nao-responda@example.com}
volumes:
  postgres_data:
