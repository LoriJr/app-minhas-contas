name: Docker Image Minhas-Contas

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: docker-image-release
  cancel-in-progress: false

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Read version from pom
      id: version
      run: |
        VERSION=$(cd backend && mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
        if [ -z "$VERSION" ]; then
          echo "::error::Falha ao ler a versao do projeto em backend/pom.xml"
          exit 1
        fi
        if curl -sf "https://hub.docker.com/v2/repositories/loujrdocker/minhas-contas/tags/$VERSION" > /dev/null; then
          echo "::error::A versao $VERSION ja existe no Docker Hub. Aumente a versao no pom.xml antes de publicar."
          exit 1
        fi
        echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Versao lida do pom.xml: $VERSION"

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{secrets.DOCKER_USERNAME}}
        password: ${{secrets.DOCKER_ACCESS_TOKEN}}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          loujrdocker/minhas-contas:${{ steps.version.outputs.tag }}
          loujrdocker/minhas-contas:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max


